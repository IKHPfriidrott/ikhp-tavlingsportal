services:
  - type: web
    name: ikhp-tavlingsportal-test
    runtime: python
    plan: free
    buildCommand: "python -m compileall -q server.py"
    startCommand: "python server.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: IKHP_HTTPS
        value: "1"
      - key: IKHP_ADMIN_PASSWORD
        sync: false
      - key: IKHP_CLUB_PASSWORD
        sync: false
